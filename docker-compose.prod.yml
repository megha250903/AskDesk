services:
  # -------------------------------------------------------------
  # Infrastructure Services
  # -------------------------------------------------------------
  mongodb:
    image: mongo:7.0
    container_name: askdesk-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - askdesk-network

  redis:
    image: redis:7-alpine
    container_name: askdesk-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - askdesk-network

  qdrant:
    image: qdrant/qdrant:latest
    container_name: askdesk-qdrant
    restart: unless-stopped
    ports:
      - '6333:6333'
      - '6334:6334'
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:6333/readyz']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - askdesk-network

  # -------------------------------------------------------------
  # Application Microservices
  # -------------------------------------------------------------
  askdesk-core:
    build:
      context: .
      dockerfile: apps/askdesk-core/Dockerfile
    container_name: askdesk-core
    restart: unless-stopped
    ports:
      - '4000:4000'
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=4000
      - MONGODB_URI=mongodb://mongodb:27017/askdesk_core
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:-askdesk-super-secret-jwt-access-token-key-2026-min-32-chars}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-askdesk-super-secret-jwt-refresh-token-key-2026-min-32-chars}
      - COOKIE_SECRET=${COOKIE_SECRET:-askdesk-super-secret-cookie-signer-key-2026-min-32-chars}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-sk_test_placeholder}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-whsec_placeholder}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - askdesk-network

  askdesk-gateway:
    build:
      context: .
      dockerfile: apps/askdesk-gateway/Dockerfile
    container_name: askdesk-gateway
    restart: unless-stopped
    ports:
      - '4001:4001'
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=4001
      - MONGODB_URI=mongodb://mongodb:27017/askdesk_core
      - REDIS_URL=redis://redis:6379
      - GROQ_API_KEY=${GROQ_API_KEY}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:-askdesk-super-secret-jwt-access-token-key-2026-min-32-chars}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - askdesk-network

  askdesk-chat:
    build:
      context: .
      dockerfile: apps/askdesk-chat/Dockerfile
    container_name: askdesk-chat
    restart: unless-stopped
    ports:
      - '4002:4002'
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=4002
      - MONGODB_URI=mongodb://mongodb:27017/askdesk_core
      - REDIS_URL=redis://redis:6379
      - QDRANT_URL=http://qdrant:6333
      - GATEWAY_URL=http://askdesk-gateway:4001
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:-askdesk-super-secret-jwt-access-token-key-2026-min-32-chars}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      askdesk-gateway:
        condition: service_started
    networks:
      - askdesk-network

  askdesk-dashboard:
    build:
      context: .
      dockerfile: apps/askdesk-dashboard/Dockerfile
    container_name: askdesk-dashboard
    restart: unless-stopped
    ports:
      - '5173:80'
    depends_on:
      - askdesk-core
      - askdesk-gateway
      - askdesk-chat
    networks:
      - askdesk-network

volumes:
  mongodb_data:
  redis_data:
  qdrant_data:

networks:
  askdesk-network:
    driver: bridge
