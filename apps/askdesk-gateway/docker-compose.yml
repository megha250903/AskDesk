version: '3.8'

services:
  gateway:
    build:
      context: ../../
      dockerfile: apps/askdesk-gateway/Dockerfile
    ports:
      - '4001:4001'
    environment:
      - NODE_ENV=production
      - PORT=4001
      - HOST=0.0.0.0
      - REDIS_URL=redis://redis:6379
      - MONGODB_URI=mongodb://mongo:27017/askdesk_core
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

volumes:
  redis_data:
